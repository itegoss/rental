{% extends 'base.html' %}
{% block title %}Add Support Service — Sick Bed Services{% endblock %}
{% block content %}
<style>
.add-service-container {
  max-width: 750px;
  margin: 40px auto;
  padding: 32px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.add-service-head {
  text-align: center;
  margin-bottom: 30px;
}
.add-service-head h2 {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--text);
}
.add-service-head h2 span {
  color: var(--primary, #ec2427);
}
.contact-row-card {
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 14px;
}
.contact-row-card h6 {
  font-weight: 700;
  color: #ec2427;
  margin-bottom: 10px;
}
.btn-submit-service {
  background-color: var(--primary, #ec2427);
  border-color: var(--primary, #ec2427);
  color: #fff;
  font-weight: 600;
  padding: 10px 24px;
  border-radius: 8px;
}
.btn-submit-service:hover {
  background-color: #c0181b;
  border-color: #c0181b;
  color: #fff;
}
</style>

<div class="container">
  <div class="add-service-container">
    <div class="add-service-head">
      <h2>Add <span>Support Service</span></h2>
      <p class="text-muted">Create a new community support service listing</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="name" class="form-label font-weight-bold">Service Name *</label>
        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. Home Care Assistance">
      </div>

      <div class="mb-3">
        <label for="description" class="form-label font-weight-bold">Description *</label>
        <textarea class="form-control" id="description" name="description" rows="4" required placeholder="Enter service details and scope..."></textarea>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked>
        <label class="form-check-label font-weight-bold" for="is_active">
          Active (visible on website)
        </label>
      </div>

      <hr class="my-4">
      <h5 class="mb-3 font-weight-bold" style="color: var(--text);">Contact Persons (Up to 4)</h5>

      <div class="contact-row-card">
        <h6>Contact 1</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_name_1" placeholder="Person Name">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_number_1" placeholder="Phone Number">
          </div>
        </div>
      </div>

      <div class="contact-row-card">
        <h6>Contact 2</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_name_2" placeholder="Person Name">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_number_2" placeholder="Phone Number">
          </div>
        </div>
      </div>

      <div class="contact-row-card">
        <h6>Contact 3</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_name_3" placeholder="Person Name">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_number_3" placeholder="Phone Number">
          </div>
        </div>
      </div>

      <div class="contact-row-card">
        <h6>Contact 4</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_name_4" placeholder="Person Name">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" name="contact_number_4" placeholder="Phone Number">
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{% url 'medical_services' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-submit-service">Save Service</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
